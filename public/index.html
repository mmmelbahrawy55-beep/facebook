<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نشر على فيسبوك</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1877f2 0%, #0d5bbd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #1877f2; margin-bottom: 10px; font-size: 28px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .status.disconnected { background: #fee; color: #c00; }
        .status.connected { background: #efe; color: #060; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; }
        input, textarea, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
        }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #1877f2; }
        textarea { min-height: 120px; resize: vertical; }
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            margin-bottom: 10px;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-blue { background: #1877f2; color: white; }
        .btn-green { background: #00a400; color: white; }
        .btn-red { background: #e41e3f; color: white; }
        .divider { margin: 20px 0; border: 1px solid #eee; }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        .result.success { display: block; background: #e8f5e9; color: #2e7d32; }
        .result.error { display: block; background: #ffebee; color: #c62828; }
        .result.info { display: block; background: #e3f2fd; color: #1565c0; }
        .note {
            background: #fff3cd;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 نشر على فيسبوك</h1>
        <p class="subtitle">نشر إعلانات على مجموعات فيسبوك</p>

        <div id="statusBox" class="status disconnected">❌ غير متصل بفيسبوك</div>

        <button id="loginBtn" class="btn btn-blue" onclick="login()">🔗 اتصل بفيسبوك</button>
        <button id="logoutBtn" class="btn btn-red" style="display: none;" onclick="logout()">🔌 قطع الاتصال</button>

        <div class="divider"></div>

        <div id="postSection" style="display: none;">
            <div class="form-group">
                <label>📝 عنوان الإعلان</label>
                <input type="text" id="title" placeholder="مثال: مطلوب موظفين">
            </div>

            <div class="form-group">
                <label>📄 وصف الإعلان</label>
                <textarea id="description" placeholder="اكتب تفاصيل الإعلان..."></textarea>
            </div>

            <div class="form-group">
                <label>📍 المحافظة</label>
                <select id="governorate">
                    <option value="">اختر المحافظة</option>
                    <option value="القاهرة">القاهرة</option>
                    <option value="الإسكندرية">الإسكندرية</option>
                    <option value="الجيزة">الجيزة</option>
                    <option value="القليوبية">القليوبية</option>
                    <option value="الشرقية">الشرقية</option>
                    <option value="الدقهلية">الدقهلية</option>
                    <option value="البحيرة">البحيرة</option>
                    <option value="كفر الشيخ">كفر الشيخ</option>
                    <option value="الغربية">الغربية</option>
                    <option value="المنوفية">المنوفية</option>
                    <option value="دمياط">دمياط</option>
                    <option value="بورسعيد">بورسعيد</option>
                    <option value="الإسماعيلية">الإسماعيلية</option>
                    <option value="بني سويف">بني سويف</option>
                    <option value="الفيوم">الفيوم</option>
                    <option value="المنيا">المنيا</option>
                    <option value="أسيوط">أسيوط</option>
                    <option value="سوهاج">سوهاج</option>
                    <option value="قنا">قنا</option>
                    <option value="الأقصر">الأقصر</option>
                    <option value="أسوان">أسوان</option>
                    <option value="البحر الأحمر">البحر الأحمر</option>
                    <option value="مطروح">مطروح</option>
                </select>
            </div>

            <button id="postBtn" class="btn btn-green" onclick="startPosting()">🚀 ابدأ النشر</button>
        </div>

        <div id="result" class="result"></div>
    </div>

    <script>
        async function login() {
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.textContent = 'جاري الاتصال...';
            showResult('جاري فتح فيسبوك...', 'info');

            const res = await fetch('/api/login', { method: 'POST' });
            const data = await res.json();

            loginBtn.disabled = false;
            loginBtn.textContent = '🔗 اتصل بفيسبوك';

            if (data.success) {
                document.getElementById('statusBox').textContent = '✅ متصل بفيسبوك';
                document.getElementById('statusBox').className = 'status connected';
                loginBtn.style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'block';
                document.getElementById('postSection').style.display = 'block';
                showResult('تم الاتصال بنجاح', 'success');
            } else {
                showResult(data.message, 'error');
            }
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            document.getElementById('statusBox').textContent = '❌ غير متصل بفيسبوك';
            document.getElementById('statusBox').className = 'status disconnected';
            document.getElementById('loginBtn').style.display = 'block';
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('postSection').style.display = 'none';
            showResult('تم قطع الاتصال', 'info');
        }

        async function startPosting() {
            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const governorate = document.getElementById('governorate').value;

            if (!title || !description || !governorate) {
                showResult('يرجى ملء كل الحقول', 'error');
                return;
            }

            const postBtn = document.getElementById('postBtn');
            postBtn.disabled = true;
            postBtn.textContent = 'جاري النشر...';
            showResult(`جاري النشر في مجموعات ${governorate}...`, 'info');

            const res = await fetch('/api/post', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description, governorate })
            });
            const data = await res.json();

            postBtn.disabled = false;
            postBtn.textContent = '🚀 ابدأ النشر';

            if (data.success) {
                showResult(data.message, 'success');
            } else {
                showResult(data.message, 'error');
            }
        }

        function showResult(msg, type) {
            const result = document.getElementById('result');
            result.className = `result ${type}`;
            result.textContent = msg;
        }
    </script>
</body>
</html>

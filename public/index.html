<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نشر على فيسبوك</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1877f2 0%, #0d5bbd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #1877f2; margin-bottom: 10px; font-size: 28px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; }
        input, textarea, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
        }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #1877f2; }
        textarea { min-height: 120px; resize: vertical; }
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            margin-bottom: 10px;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-blue { background: #1877f2; color: white; }
        .btn-green { background: #00a400; color: white; }
        .btn-red { background: #e41e3f; color: white; }
        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .status.disconnected { background: #fee; color: #c00; }
        .status.connected { background: #efe; color: #060; }
        .log {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        .log.active { display: block; }
        .log-entry { padding: 8px; margin-bottom: 5px; border-radius: 5px; font-size: 14px; }
        .log-entry.success { background: #e8f5e9; color: #2e7d32; }
        .log-entry.error { background: #ffebee; color: #c62828; }
        .log-entry.info { background: #e3f2fd; color: #1565c0; }
        .divider { margin: 20px 0; border: 1px solid #eee; }
        .setup-info {
            background: #fff3cd;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .setup-info h3 { color: #856404; margin-bottom: 10px; }
        .setup-info ol { padding-right: 20px; color: #856404; }
        .ads-list { margin-top: 20px; }
        .ad-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .ad-item h4 { color: #333; margin-bottom: 5px; }
        .ad-item p { color: #666; font-size: 14px; }
        .ad-actions { margin-top: 10px; display: flex; gap: 10px; }
        .btn-sm { padding: 8px 16px; font-size: 14px; width: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 نشر على فيسبوك</h1>
        <p class="subtitle">نشر إعلانات على مجموعات فيسبوك</p>

        <div class="setup-info">
            <h3>⚙️ الإعداد المطلول:</h3>
            <ol>
                <li>أنشئ حساب على <a href="https://supabase.com" target="_blank">Supabase</a> (مجاني)</li>
                <li>أنشئ مشروع جديد وخذ الـ URL و Key</li>
                <li>أنشئ حساب على <a href="https://developers.facebook.com" target="_blank">Facebook Developers</a></li>
                <li>أنشئ App واختر "Consumer"</li>
                <li>احصل على Page Access Token</li>
            </ol>
        </div>

        <div id="statusBox" class="status disconnected">غير مُعد</div>

        <div class="form-group">
            <label>🔗 Supabase URL</label>
            <input type="text" id="supabaseUrl" placeholder="https://xxxxx.supabase.co">
        </div>

        <div class="form-group">
            <label>🔑 Supabase Key</label>
            <input type="text" id="supabaseKey" placeholder="eyJhbGciOiJIUzI1NiIs...">
        </div>

        <div class="form-group">
            <label>🎫 Facebook Page Access Token</label>
            <input type="text" id="fbToken" placeholder="EAAG...">
        </div>

        <button id="saveConfigBtn" class="btn btn-blue">💾 حفظ الإعدادات</button>

        <div class="divider"></div>

        <div id="postSection" style="display: none;">
            <h2 style="margin-bottom: 20px; color: #333;">📝 إعلان جديد</h2>
            
            <div class="form-group">
                <label>عنوان الإعلان</label>
                <input type="text" id="title" placeholder="مثال: مطلوب موظفين">
            </div>

            <div class="form-group">
                <label>وصف الإعلان</label>
                <textarea id="description" placeholder="اكتب تفاصيل الإعلان..."></textarea>
            </div>

            <div class="form-group">
                <label>📍 المحافظة</label>
                <select id="governorate">
                    <option value="">اختر المحافظة</option>
                    <option value="Cairo">القاهرة</option>
                    <option value="Alexandria">الإسكندرية</option>
                    <option value="Giza">الجيزة</option>
                    <option value="Qalyubia">القليوبية</option>
                    <option value="Sharqia">الشرقية</option>
                    <option value="Dakahlia">الدقهلية</option>
                    <option value="Beheira">البحيرة</option>
                    <option value="Kafr El Sheikh">كفر الشيخ</option>
                    <option value="Gharbia">الغربية</option>
                    <option value="Monufia">المنوفية</option>
                    <option value="Damietta">دمياط</option>
                    <option value="Port Said">بورسعيد</option>
                    <option value="Ismailia">الإسماعيلية</option>
                    <option value="Beni Suef">بني سويف</option>
                    <option value="Faiyum">الفيوم</option>
                    <option value="Minya">المنيا</option>
                    <option value="Assiut">أسيوط</option>
                    <option value="Sohag">سوهاج</option>
                    <option value="Qena">قنا</option>
                    <option value="Luxor">الأقصر</option>
                    <option value="Aswan">أسوان</option>
                    <option value="Red Sea">البحر الأحمر</option>
                    <option value="Matrouh">مطروح</option>
                </select>
            </div>

            <div class="form-group">
                <label>🔗 رابط الصفحة (Page ID)</label>
                <input type="text" id="pageId" placeholder="مثال: 123456789">
            </div>

            <button id="postBtn" class="btn btn-green">🚀 ابدأ النشر</button>
        </div>

        <div id="log" class="log"></div>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

        let supabase = null;
        let config = {
            supabaseUrl: localStorage.getItem('supabaseUrl') || '',
            supabaseKey: localStorage.getItem('supabaseKey') || '',
            fbToken: localStorage.getItem('fbToken') || ''
        };

        const statusBox = document.getElementById('statusBox');
        const postSection = document.getElementById('postSection');
        const logDiv = document.getElementById('log');
        const saveConfigBtn = document.getElementById('saveConfigBtn');
        const postBtn = document.getElementById('postBtn');

        // Load saved config
        document.getElementById('supabaseUrl').value = config.supabaseUrl;
        document.getElementById('supabaseKey').value = config.supabaseKey;
        document.getElementById('fbToken').value = config.fbToken;

        if (config.supabaseUrl && config.supabaseKey && config.fbToken) {
            initSupabase();
        }

        function addLog(msg, type = 'info') {
            logDiv.classList.add('active');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = msg;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function initSupabase() {
            try {
                supabase = createClient(config.supabaseUrl, config.supabaseKey);
                
                // Create tables if not exists
                await supabase.rpc('create_tables_if_not_exists').catch(() => {
                    // Table might already exist
                });

                statusBox.textContent = '✅ جاهز للنشر';
                statusBox.className = 'status connected';
                postSection.style.display = 'block';
                addLog('تم الاتصال بقاعدة البيانات', 'success');
            } catch (error) {
                addLog('خطأ في الاتصال بقاعدة البيانات: ' + error.message, 'error');
            }
        }

        saveConfigBtn.addEventListener('click', () => {
            config.supabaseUrl = document.getElementById('supabaseUrl').value.trim();
            config.supabaseKey = document.getElementById('supabaseKey').value.trim();
            config.fbToken = document.getElementById('fbToken').value.trim();

            localStorage.setItem('supabaseUrl', config.supabaseUrl);
            localStorage.setItem('supabaseKey', config.supabaseKey);
            localStorage.setItem('fbToken', config.fbToken);

            if (config.supabaseUrl && config.supabaseKey && config.fbToken) {
                initSupabase();
                addLog('تم حفظ الإعدادات', 'success');
            } else {
                addLog('يرجى ملء كل الحقول', 'error');
            }
        });

        postBtn.addEventListener('click', async () => {
            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const governorate = document.getElementById('governorate').value;
            const pageId = document.getElementById('pageId').value.trim();

            if (!title || !description || !governorate || !pageId) {
                addLog('يرجى ملء كل الحقول', 'error');
                return;
            }

            postBtn.disabled = true;
            postBtn.textContent = 'جاري النشر...';

            try {
                // Save ad to database
                const { error: dbError } = await supabase
                    .from('ads')
                    .insert({
                        title,
                        description,
                        governorate,
                        page_id: pageId,
                        status: 'posting'
                    });

                if (dbError) throw dbError;

                // Search for groups and post
                addLog(`جاري البحث عن مجموعات ${governorate}...`, 'info');

                const response = await fetch('/api/post', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title,
                        description,
                        governorate,
                        pageId,
                        accessToken: config.fbToken
                    })
                });

                const result = await response.json();

                if (result.success) {
                    addLog(`تم النشر بنجاح في ${result.posted} مجموعة`, 'success');
                } else {
                    addLog(result.message || 'فشل النشر', 'error');
                }
            } catch (error) {
                addLog('خطأ: ' + error.message, 'error');
            } finally {
                postBtn.disabled = false;
                postBtn.textContent = '🚀 ابدأ النشر';
            }
        });
    </script>
</body>
</html>

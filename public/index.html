<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نشر على فيسبوك</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1877f2 0%, #0d5bbd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #1877f2; margin-bottom: 10px; font-size: 28px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; }
        input, textarea, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
        }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #1877f2; }
        textarea { min-height: 120px; resize: vertical; }
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            margin-bottom: 10px;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-green { background: #00a400; color: white; }
        .btn-blue { background: #1877f2; color: white; }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        .result.success { display: block; background: #e8f5e9; color: #2e7d32; }
        .result.error { display: block; background: #ffebee; color: #c62828; }
        .history { margin-top: 30px; }
        .history h3 { color: #333; margin-bottom: 15px; }
        .history-item {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 نشر على فيسبوك</h1>
        <p class="subtitle">نشر إعلانات على مجموعات فيسبوك</p>

        <div class="form-group">
            <label>🎫 Facebook Access Token</label>
            <input type="text" id="token" placeholder="EAAG...">
        </div>

        <div class="form-group">
            <label>📝 عنوان الإعلان</label>
            <input type="text" id="title" placeholder="مثال: مطلوب موظفين">
        </div>

        <div class="form-group">
            <label>📄 وصف الإعلان</label>
            <textarea id="description" placeholder="اكتب تفاصيل الإعلان..."></textarea>
        </div>

        <div class="form-group">
            <label>📍 المحافظة</label>
            <select id="governorate">
                <option value="">اختر المحافظة</option>
                <option value="Cairo">القاهرة</option>
                <option value="Alexandria">الإسكندرية</option>
                <option value="Giza">الجيزة</option>
                <option value="Qalyubia">القليوبية</option>
                <option value="Sharqia">الشرقية</option>
                <option value="Dakahlia">الدقهلية</option>
                <option value="Beheira">البحيرة</option>
                <option value="Kafr El Sheikh">كفر الشيخ</option>
                <option value="Gharbia">الغربية</option>
                <option value="Monufia">المنوفية</option>
                <option value="Damietta">دمياط</option>
                <option value="Port Said">بورسعيد</option>
                <option value="Ismailia">الإسماعيلية</option>
                <option value="Beni Suef">بني سويف</option>
                <option value="Faiyum">الفيوم</option>
                <option value="Minya">المنيا</option>
                <option value="Assiut">أسيوط</option>
                <option value="Sohag">سوهاج</option>
                <option value="Qena">قنا</option>
                <option value="Luxor">الأقصر</option>
                <option value="Aswan">أسوان</option>
                <option value="Red Sea">البحر الأحمر</option>
                <option value="Matrouh">مطروح</option>
            </select>
        </div>

        <button id="postBtn" class="btn btn-green">🚀 ابدأ النشر</button>

        <div id="result" class="result"></div>

        <div class="history">
            <h3>📊 آخر النشر</h3>
            <div id="historyList">جاري التحميل...</div>
        </div>
    </div>

    <script>
        const postBtn = document.getElementById('postBtn');
        const resultDiv = document.getElementById('result');
        const historyList = document.getElementById('historyList');

        // Load history
        async function loadHistory() {
            try {
                const res = await fetch('/api/history');
                const data = await res.json();
                if (data.length === 0) {
                    historyList.innerHTML = 'لا يوجد سجل بعد';
                    return;
                }
                historyList.innerHTML = data.map(h => `
                    <div class="history-item">
                        <strong>${h.title}</strong> - ${h.governorate}<br>
                        ✅ ${h.posted} نجح | ❌ ${h.failed} فشل
                    </div>
                `).join('');
            } catch (e) {
                historyList.innerHTML = 'خطأ في التحميل';
            }
        }
        loadHistory();

        // Post
        postBtn.addEventListener('click', async () => {
            const token = document.getElementById('token').value.trim();
            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const governorate = document.getElementById('governorate').value;

            if (!token || !title || !description || !governorate) {
                resultDiv.className = 'result error';
                resultDiv.textContent = 'يرجى ملء كل الحقول';
                return;
            }

            postBtn.disabled = true;
            postBtn.textContent = 'جاري النشر...';
            resultDiv.className = 'result';

            try {
                const res = await fetch('/api/post', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, description, governorate, accessToken: token })
                });
                const data = await res.json();

                if (data.error) {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = data.error;
                } else {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ تم النشر: ${data.posted} نجح, ${data.failed} فشل`;
                    loadHistory();
                }
            } catch (e) {
                resultDiv.className = 'result error';
                resultDiv.textContent = 'خطأ في الاتصال';
            }

            postBtn.disabled = false;
            postBtn.textContent = '🚀 ابدأ النشر';
        });
    </script>
</body>
</html>

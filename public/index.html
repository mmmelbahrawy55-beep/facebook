<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نشر على فيسبوك</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1877f2 0%, #0d5bbd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #1877f2;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .status.disconnected { background: #fee; color: #c00; }
        .status.connected { background: #efe; color: #060; }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #1877f2;
        }
        textarea { min-height: 120px; resize: vertical; }
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s;
            margin-bottom: 10px;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-blue { background: #1877f2; color: white; }
        .btn-blue:hover:not(:disabled) { background: #166fe5; }
        .btn-red { background: #e41e3f; color: white; }
        .btn-red:hover:not(:disabled) { background: #c13549; }
        .btn-green { background: #00a400; color: white; }
        .btn-green:hover:not(:disabled) { background: #008f00; }
        .log {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        .log.active { display: block; }
        .log-entry {
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 5px;
            font-size: 14px;
        }
        .log-entry.success { background: #e8f5e9; color: #2e7d32; }
        .log-entry.error { background: #ffebee; color: #c62828; }
        .log-entry.info { background: #e3f2fd; color: #1565c0; }
        .spinner {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .spinner.active { display: block; }
        .spinner::after {
            content: '';
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #e0e0e0;
            border-top-color: #1877f2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 نشر على فيسبوك</h1>
        <p class="subtitle">نشر إعلانات على مجموعات فيسبوك</p>

        <div id="statusBox" class="status disconnected">
            غير متصل بفيسبوك
        </div>

        <button id="loginBtn" class="btn btn-blue">
            🔗 اتصل بفيسبوك
        </button>

        <button id="logoutBtn" class="btn btn-red" style="display: none;">
            🔌 قطع الاتصال
        </button>

        <hr style="margin: 20px 0; border: 1px solid #eee;">

        <div id="postForm" style="display: none;">
            <div class="form-group">
                <label>📝 عنوان الإعلان</label>
                <input type="text" id="title" placeholder="مثال: مطلوب موظفين">
            </div>

            <div class="form-group">
                <label>📄 وصف الإعلان</label>
                <textarea id="description" placeholder="اكتب تفاصيل الإعلان..."></textarea>
            </div>

            <div class="form-group">
                <label>📍 المحافظة</label>
                <select id="governorate">
                    <option value="">اختر المحافظة</option>
                    <option value="القاهرة">القاهرة</option>
                    <option value="الإسكندرية">الإسكندرية</option>
                    <option value="الجيزة">الجيزة</option>
                    <option value="القليوبية">القليوبية</option>
                    <option value="الشرقية">الشرقية</option>
                    <option value="الدقهلية">الدقهلية</option>
                    <option value="البحيرة">البحيرة</option>
                    <option value="كفر الشيخ">كفر الشيخ</option>
                    <option value="الغربية">الغربية</option>
                    <option value="المنوفية">المنوفية</option>
                    <option value="دمياط">دمياط</option>
                    <option value="بورسعيد">بورسعيد</option>
                    <option value="الإسماعيلية">الإسماعيلية</option>
                    <option value="بني سويف">بني سويف</option>
                    <option value="الفيوم">الفيوم</option>
                    <option value="المنيا">المنيا</option>
                    <option value="أسيوط">أسيوط</option>
                    <option value="سوهاج">سوهاج</option>
                    <option value="قنا">قنا</option>
                    <option value="الأقصر">الأقصر</option>
                    <option value="أسوان">أسوان</option>
                    <option value="البحر الأحمر">البحر الأحمر</option>
                    <option value="مطروح">مطروح</option>
                </select>
            </div>

            <button id="postBtn" class="btn btn-green">
                🚀 ابدأ النشر
            </button>
        </div>

        <div id="spinner" class="spinner"></div>

        <div id="log" class="log"></div>
    </div>

    <script>
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const postBtn = document.getElementById('postBtn');
        const postForm = document.getElementById('postForm');
        const statusBox = document.getElementById('statusBox');
        const spinner = document.getElementById('spinner');
        const logDiv = document.getElementById('log');

        function addLog(msg, type = 'info') {
            logDiv.classList.add('active');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = msg;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function setStatus(connected) {
            if (connected) {
                statusBox.textContent = '✅ متصل بفيسبوك';
                statusBox.className = 'status connected';
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'block';
                postForm.style.display = 'block';
            } else {
                statusBox.textContent = '❌ غير متصل بفيسبوك';
                statusBox.className = 'status disconnected';
                loginBtn.style.display = 'block';
                logoutBtn.style.display = 'none';
                postForm.style.display = 'none';
            }
        }

        // Check status on load
        fetch('/api/status').then(r => r.json()).then(d => setStatus(d.loggedIn));

        // Login
        loginBtn.addEventListener('click', async () => {
            loginBtn.disabled = true;
            loginBtn.textContent = 'جاري الاتصال...';
            spinner.classList.add('active');
            addLog('جاري فتح فيسبوك...', 'info');

            const res = await fetch('/api/login', { method: 'POST' });
            const data = await res.json();

            spinner.classList.remove('active');
            loginBtn.disabled = false;
            loginBtn.textContent = '🔗 اتصل بفيسبوك';

            if (data.success) {
                setStatus(true);
                addLog('تم الاتصال بنجاح', 'success');
            } else {
                addLog(data.message, 'error');
            }
        });

        // Logout
        logoutBtn.addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST' });
            setStatus(false);
            addLog('تم قطع الاتصال', 'info');
        });

        // Post
        postBtn.addEventListener('click', async () => {
            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const governorate = document.getElementById('governorate').value;

            if (!title || !description || !governorate) {
                addLog('يرجى ملء كل الحقول', 'error');
                return;
            }

            postBtn.disabled = true;
            postBtn.textContent = 'جاري النشر...';
            spinner.classList.add('active');
            addLog(`جاري النشر في مجموعات ${governorate}...`, 'info');

            const res = await fetch('/api/post', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description, governorate })
            });
            const data = await res.json();

            spinner.classList.remove('active');
            postBtn.disabled = false;
            postBtn.textContent = '🚀 ابدأ النشر';

            if (data.success) {
                addLog(data.message, 'success');
            } else {
                addLog(data.message, 'error');
            }
        });
    </script>
</body>
</html>
